# Netlify configuration for Florida Breeze Air Duct (Astro static site)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Note: no manual trailing-slash redirects here. Netlify normalizes
# /page <-> /page/ on its own; forced self-redirects create an infinite
# redirect loop because rule matching ignores the trailing slash.
