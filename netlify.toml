# Netlify configuration for Florida Breeze Air Duct (Astro static site)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Note: no [[redirects]] trailing-slash rules here. Netlify's redirect
# matcher ignores trailing slashes, so a forced /page -> /page/ rule
# matches its own target and loops forever (this broke /thank-you/ once).
# Trailing-slash normalization is handled by
# netlify/edge-functions/trailing-slash.ts instead, which compares the raw
# pathname and therefore cannot loop.
