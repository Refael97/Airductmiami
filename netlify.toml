# Netlify configuration for Air Duct Florida (Astro static site)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Ensure the no-trailing-slash thank-you URLs always resolve to the built pages,
# so a form redirect (or a manually typed URL) never 404s.
[[redirects]]
  from = "/thank-you"
  to = "/thank-you/"
  status = 301
  force = true

[[redirects]]
  from = "/es/gracias"
  to = "/es/gracias/"
  status = 301
  force = true
