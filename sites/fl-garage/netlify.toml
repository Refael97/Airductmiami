# Netlify configuration for the Florida garage door site (Astro static).
# Deployed from the sites/fl-garage base directory of the network monorepo.
#
# The Netlify site that was created for sites/ny-garage must have its base
# directory changed to sites/fl-garage, or be recreated. See HANDOVER.md.

[build]
  base = "sites/fl-garage"
  command = "npm run build"
  publish = "dist"
  # Skip the build unless something inside sites/fl-garage changed. The
  # ignore command runs from the base directory, so "." is exactly this
  # site and nothing else in the monorepo.
  #
  # Netlify inverts the usual convention: exit 0 SKIPS the build, non-zero
  # proceeds. git diff --quiet exits 0 when there is no difference, which
  # is the behaviour we want. On a first build CACHED_COMMIT_REF is empty,
  # git errors, and the build proceeds, which is the safe direction.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

# The help widget's messaging route. Netlify would find this by default;
# naming it means a move shows up as a config change rather than as a
# silently 404ing endpoint.
#
# Requires ANTHROPIC_API_KEY in the site's environment variables. Set it in
# the Netlify UI, never in this file and never in the repository. Until it is
# set the function answers 503 with configured:false and the widget shows the
# technician's number instead of a chat that fails without saying so.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

# No [[redirects]] trailing-slash rules: Netlify's matcher ignores trailing
# slashes, so a forced /page -> /page/ rule matches its own target and loops.
# Normalization is handled by netlify/edge-functions/trailing-slash.ts.
