# Netlify configuration for Dryer Vent Florida (Astro static site)

[build]
  base = "sites/fl-dryervent"
  command = "npm run build"
  publish = "dist"
  # Skip the build when nothing this site is made of has changed.
  #
  # Every site in the network lives in this one repo on one branch, so
  # without this, a commit touching only sites/ny-garage rebuilds Florida
  # too. At two sites that is waste. At the scale this network is heading
  # for it is one build per site per commit, which exhausts any build
  # allowance almost immediately.
  #
  # Netlify's semantics are inverted and easy to get backwards: exit 0
  # means SKIP the build, non-zero means PROCEED. So git diff --quiet,
  # which exits 0 when there are no differences, is exactly right.
  #
  # On the very first build CACHED_COMMIT_REF is empty, git diff errors,
  # the exit is non-zero and the build proceeds. Failing towards building
  # is the safe direction.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

# The help chat endpoint. netlify/functions/chat.mts declares its own route
# with `export const config = { path: '/api/chat' }`, so no redirect is
# needed. The directory is relative to `base`, and is spelled out (as in
# sites/fl-garage) so nobody has to remember Netlify's default. The function
# reads ANTHROPIC_API_KEY from the site's environment variables; until it is
# set the endpoint answers `configured: false` and the widget falls back to
# the phone and the quote form.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

# Note: no [[redirects]] trailing-slash rules here. Netlify's redirect
# matcher ignores trailing slashes, so a forced /page -> /page/ rule
# matches its own target and loops forever (this broke /thank-you/ once).
# Trailing-slash normalization is handled by
# netlify/edge-functions/trailing-slash.ts instead, which compares the raw
# pathname and therefore cannot loop.
